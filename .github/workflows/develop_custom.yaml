name: Develop Custom Release

on:
  push:
    branches:
      - develop-custom
    paths-ignore:
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  custom-firmware-build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image with cache
      uses: docker/build-push-action@v6
      with:
        context: .github/dev
        load: true
        tags: snapmaker-u1-dev:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: BUILDKIT_INLINE_CACHE=1

    - name: Load values vars.mk
      run: cat vars.mk >> "$GITHUB_ENV"

    - name: Restore Firmwares Cache
      id: cache-firmwares
      uses: actions/cache/restore@v4
      with:
        path: firmware/
        key: firmwares-${{ runner.os }}-${{ runner.arch }}-${{ env.FIRMWARE_VERSION }}

    - name: Restore Kernel Cache
      id: cache-kernel
      uses: actions/cache/restore@v4
      with:
        path: tmp/kernel/
        key: kernels-${{ runner.os }}-${{ runner.arch }}-${{ env.KERNEL_SHA }}

    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: tmp/ccache/
        key: ccache-${{ runner.os }}-${{ runner.arch }}-develop-custom
        restore-keys: |
          ccache-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore downloads cache
      uses: actions/cache/restore@v4
      with:
        path: |
          tmp/cache/**/.git
          tmp/cache/**/*.zip
          tmp/cache/**/*.gz
          tmp/cache/**/*.xz
        key: downloads-${{ runner.os }}-${{ runner.arch }}-develop-custom
        restore-keys: |
          downloads-${{ runner.os }}-${{ runner.arch }}-

    - name: Set GIT_VERSION
      shell: bash
      run: |
        nextVer=$(./scripts/next_version.sh paxx12 "custom-$(git describe --abbrev --always)")
        echo "GIT_VERSION=${nextVer#v}" | tee -a $GITHUB_ENV

    - name: Download firmware
      run: ./dev.sh make firmware

    - name: Build extended profile
      run: ./dev.sh make build PROFILE=extended OUTPUT_FILE=U1_extended_${{ env.GIT_VERSION }}_upgrade.bin

    - name: Generate release notes
      run: |
        {
          echo '## Notice'
          echo
          echo '> **This is a rolling `develop-custom` build**, overwritten automatically on'
          echo '> every push. It is untested; use it to preview changes.'
          echo
          echo "Built from \`$(git rev-parse --short HEAD)\` on stock \`${FIRMWARE_VERSION}\`."
          echo
          echo '## Recent merges'
          echo
          git log --first-parent --format='- %h %s' -15
          echo
          echo '## Checksums'
          echo
          echo '<!-- CHECKSUMS_PLACEHOLDER -->'
        } > RELEASE.custom.md
        node .github/scripts/append_checksums.js RELEASE.custom.md U1_extended_${{ env.GIT_VERSION }}_upgrade.bin

    - name: Move `rolling-custom` tag to this build
      run: |
        git tag -f rolling-custom
        git push origin rolling-custom --force

    - name: 'Update rolling-custom release'
      uses: ncipollo/release-action@v1
      with:
        tag: "rolling-custom"
        name: "Rolling custom: v${{ env.GIT_VERSION }}"
        allowUpdates: true
        removeArtifacts: true
        prerelease: true
        makeLatest: false
        bodyFile: RELEASE.custom.md
        artifacts: "U1_*_upgrade.bin"

    - name: Save Firmwares Cache
      if: steps.cache-firmwares.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: firmware/
        key: firmwares-${{ runner.os }}-${{ runner.arch }}-${{ env.FIRMWARE_VERSION }}

    - name: Save Kernel Cache
      if: steps.cache-kernel.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: tmp/kernel/
        key: kernels-${{ runner.os }}-${{ runner.arch }}-${{ env.KERNEL_SHA }}

    - name: Save ccache
      uses: actions/cache/save@v4
      with:
        path: tmp/ccache/
        key: ccache-${{ runner.os }}-${{ runner.arch }}-develop-custom

    - name: Save downloads cache
      uses: actions/cache/save@v4
      with:
        path: |
          tmp/cache/**/.git
          tmp/cache/**/*.zip
          tmp/cache/**/*.gz
          tmp/cache/**/*.xz
        key: downloads-${{ runner.os }}-${{ runner.arch }}-develop-custom
