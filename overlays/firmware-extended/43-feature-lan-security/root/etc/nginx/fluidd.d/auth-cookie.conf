# Copies Fluidd's login token into a cookie so camera requests authenticate
location = /auth-cookie.js {
    alias /usr/local/share/firmware-config/html/auth-cookie.js;
    default_type application/javascript;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}
