location = /firmware-config {
    return 302 /firmware-config/;
}

# Fluidd loads these on its own login screen, so they must stay reachable
location = /firmware-config/nav.js {
    alias /usr/local/share/firmware-config/html/nav.js;
}

location = /firmware-config/print-map.js {
    alias /usr/local/share/firmware-config/html/print-map.js;
}

location /firmware-config/ {
    alias /usr/local/share/firmware-config/html/;
    index index.html;
    auth_request /auth_check;
    error_page 401 = @login_redirect;
}

location /firmware-config/api/ {
    auth_request /auth_check;
    proxy_pass http://127.0.0.1:9091/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
}
