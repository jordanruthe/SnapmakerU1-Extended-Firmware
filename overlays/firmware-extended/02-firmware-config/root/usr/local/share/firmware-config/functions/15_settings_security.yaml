settings:
  security:
    label: Security
    items:
      auth:
        label: LAN Security (Authentication)
        description: Require a login or API key for the web interface, camera and metrics. Only the printer itself is trusted. Also closes Snapmaker LAN MQTT to the network, makes SSH key-only and turns RTSP off. Reboot afterwards to apply everything.
        get_cmd:
          - /usr/local/bin/extended-config.py
          - get
          - /home/lava/printer_data/config/extended/extended2.cfg
          - security
          - auth
          - "false"
        options:
          "true":
            label: Enabled
            confirm: "Enable LAN security? An admin user with a random password will be created and every device on your network must log in or use the API key. SSH needs a public key in extended/ssh/authorized_keys. RTSP is turned off. Works with Fluidd only."
            cmd:
              - bash
              - -c
              - |
                CFG=/home/lava/printer_data/config/extended/extended2.cfg
                FRONTEND=$(/usr/local/bin/extended-config.py get $CFG web frontend fluidd)
                if [ "$FRONTEND" = "mainsail" ]; then
                  echo "ERROR: Authentication requires Fluidd."
                  echo "Mainsail does not support Moonraker authentication."
                  echo "Please switch to Fluidd first."
                  exit 1
                fi
                CLOUD=$(/usr/local/bin/extended-config.py get $CFG remote_access cloud none)
                if [ "$CLOUD" = "octoeverywhere" ]; then
                  echo "ERROR: OctoEverywhere companion mode is incompatible with authentication."
                  echo "Disable OctoEverywhere first to enable authentication."
                  exit 1
                fi
                URL="http://127.0.0.1:7125"
                echo "Deleting existing admin user..."
                /usr/local/bin/curl -s -X DELETE "$URL/access/user" -H "Content-Type: application/json" -d '{"username": "admin"}' > /dev/null 2>&1
                /usr/local/bin/extended-config.py add $CFG security auth true
                /usr/local/sbin/security-setup apply
                echo "Restarting Moonraker..."
                /etc/init.d/S61moonraker restart
                echo "Waiting for Moonraker to restart..."
                sleep 10
                PASSWORD=$(head -c 12 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 16)
                echo "Creating new admin user..."
                RESULT=$(/usr/local/bin/curl -s -X POST "$URL/access/user" -H "Content-Type: application/json" -d "{\"username\": \"admin\", \"password\": \"$PASSWORD\"}")
                if echo "$RESULT" | grep -q '"action": "user_created"'; then
                  echo ""
                  echo "============================================"
                  echo "  IMPORTANT: Save these credentials!"
                  echo "============================================"
                  echo "  Username: admin"
                  echo "  Password: $PASSWORD"
                  echo "============================================"
                  echo ""
                  echo "Change the password in Fluidd under Profile."
                  echo "For Orca / Mobileraker use the API key action."
                  echo "Reboot the printer to finish applying (MQTT, SSH, camera)."
                  echo "If you get locked out, put 'extended-recover.txt' on a USB drive and reboot."
                else
                  echo "Warning: Could not create admin user"
                  echo "$RESULT"
                fi
          "false":
            label: Disabled
            confirm: "Disable LAN security? Anyone on your network will be able to control the printer."
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg security auth false &&
                /usr/local/sbin/security-setup apply &&
                echo "Authentication disabled. Restarting Moonraker (reboot to finish)..." &&
                /etc/init.d/S61moonraker restart
        default: "false"

      snapmaker_cloud:
        label: Snapmaker Cloud
        description: Blocked keeps the printer in LAN mode and stops the Snapmaker software from reaching any non-local address (cloud API, TUTK relay). Reboot to apply.
        get_cmd:
          - /usr/local/bin/extended-config.py
          - get
          - /home/lava/printer_data/config/extended/extended2.cfg
          - security
          - snapmaker_cloud
          - blocked
        options:
          blocked:
            label: Blocked
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg security snapmaker_cloud blocked &&
                /usr/local/sbin/security-setup apply &&
                /etc/init.d/S80dnsmasq restart &&
                echo "Reboot the printer to apply."
          allowed:
            label: Allowed
            confirm: "Allow the Snapmaker software to contact Snapmaker's cloud again?"
            cmd:
              - bash
              - -xc
              - |
                /usr/local/bin/extended-config.py add /home/lava/printer_data/config/extended/extended2.cfg security snapmaker_cloud allowed &&
                /usr/local/sbin/security-setup apply &&
                /etc/init.d/S80dnsmasq restart &&
                echo "Reboot the printer to apply."
        default: blocked

actions:
  security:
    label: Security
    items:
      show-api-key:
        label: Show API Key
        description: Show the Moonraker API key for Orca, Mobileraker and scripts (send it as the X-Api-Key header).
        cmd:
          - /usr/local/bin/curl
          - -s
          - http://127.0.0.1:7125/access/api_key
        message: "API key (the value of \"result\"):"

      regenerate-api-key:
        label: Regenerate API Key
        description: Create a new API key. Devices using the old key stop working.
        confirm: true
        cmd:
          - /usr/local/bin/curl
          - -s
          - -X
          - POST
          - http://127.0.0.1:7125/access/api_key
        message: "New API key (the value of \"result\"):"
