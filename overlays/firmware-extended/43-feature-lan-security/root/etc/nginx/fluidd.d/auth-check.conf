# Internal auth check endpoint: succeeds when Moonraker would allow the client
# (trusted IP, Authorization header, X-Api-Key, moonraker_token cookie or ?token=).
# Used by the webcam, remote screen, firmware-config and metrics locations.
# Static pages send visitors who are not logged in to Fluidd's login (/).
location @login_redirect {
    add_header Set-Cookie "login_next=$login_next; Path=/; Max-Age=600; SameSite=Lax$login_cookie_secure" always;
    return 302 /;
}

location = /auth_check {
    internal;
    # Forward token query parameter if present (for websocket oneshot tokens)
    proxy_pass http://apiserver/access/user$is_args$args;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Authorization $auth_check_authz;
    proxy_set_header X-Api-Key $http_x_api_key;
    # Forward client IP for oneshot token validation and trusted_clients
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
