# Klipper Prometheus exporter, reachable with a login / API key when
# LAN security binds it to 127.0.0.1:9101
location = /metrics {
    auth_request /auth_check;
    proxy_pass http://127.0.0.1:9101/metrics$is_args$args;
    proxy_set_header Host $host;
}
