# Authorization for /auth_check: a real Authorization header wins, otherwise
# fall back to the moonraker_token cookie set by /auth-cookie.js. Browsers
# cannot attach headers to <img> and WebRTC requests for the camera.
map $cookie_moonraker_token $auth_cookie_authz {
    ""      "";
    default "Bearer $cookie_moonraker_token";
}

# Page to return to after logging in. Only plain same-origin paths are kept, so
# the value is safe inside a Set-Cookie header and cannot point off-site.
map $request_uri $login_next {
    default "/";
    "~^(?<next_safe>/(?!/)[A-Za-z0-9/_.~%+=&?-]*)$" $next_safe;
}

map $https $login_cookie_secure {
    on      "; Secure";
    default "";
}

map $http_authorization $auth_check_authz {
    ""      $auth_cookie_authz;
    default $http_authorization;
}
